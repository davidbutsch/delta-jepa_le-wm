# @package _global_
# Local launcher configuration (no SLURM)

defaults:
  - override /hydra/launcher: basic

wandb:
  enabled: True
  config:
    entity: dcbutsch-texas-a-m-university
    project: delta-jepa_lewm
    name: ${output_model_name}
    id: ${subdir}
    resume: allow
    log_model: False